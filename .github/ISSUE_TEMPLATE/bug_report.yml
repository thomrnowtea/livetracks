name: Bug report
description: Report a reproducible LiveTracks problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
    validations:
      required: true
  - type: textarea
    id: routing
    attributes:
      label: Audio route
      description: Internal output, USB DAC/interface, channel mode, sample rate.
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: XRuns, sample rate, channels, file formats, logs without private data.

